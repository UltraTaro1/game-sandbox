<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DROP ZONE · 第三人称吃鸡</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151a20'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ffb03a' stroke-width='3'/%3E%3C/svg%3E"
    />
    <style>
      /* 先铺底色再加载 CSS，避免跳转时闪一下白屏 */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }
      #app {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="hidden">
      <div id="crosshair">
        <i class="ch t"></i><i class="ch b"></i><i class="ch l"></i><i class="ch r"></i>
        <b class="ch dot"></b>
      </div>

      <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

      <div id="scope">
        <div class="sc-ring"></div>
        <div class="sc-cross h"></div>
        <div class="sc-cross v"></div>
      </div>

      <div id="topbar">
        <div class="stat"><b id="statAlive">16</b><span>存活</span></div>
        <div class="stat"><b id="statKills">0</b><span>淘汰</span></div>
        <div class="stat"><b id="statAcc">--</b><span>命中率</span></div>
        <div class="stat"><b id="statPlace">0:00</b><span>时间</span></div>
      </div>

      <canvas id="minimap" width="180" height="180"></canvas>

      <div id="zoneHud">
        <span id="zoneLabel">下次收缩</span>
        <b id="zoneTime">30s</b>
      </div>

      <div id="killfeed"></div>

      <div id="pickupPrompt"><kbd id="promptKey">F</kbd><span id="pickupText"></span></div>

      <div id="bottom">
        <div id="vitals">
          <div id="armorBox"><div id="armorFill"></div></div>
          <div id="healthBox">
            <div id="healthFill"></div>
            <span id="hpText">100</span>
          </div>
        </div>
        <div id="weaponBox">
          <div id="weaponIcon"></div>
          <div class="wname" id="weaponName">AR-4</div>
          <div class="ammo"><b id="ammoMag">30</b><span id="ammoReserve">/ 30</span></div>
          <div class="reload" id="reloadText">换弹中…</div>
        </div>
      </div>

      <div id="damageVignette"></div>
    </div>

    <div id="overlay">
      <div class="panel">
        <h1 id="ovTitle">DROP ZONE</h1>
        <p id="ovSub" class="sub">第三人称吃鸡</p>
        <div id="ovKeys" class="keys">
          <div><kbd>W A S D</kbd><span>移动</span></div>
          <div><kbd>Shift</kbd><span>冲刺</span></div>
          <div><kbd>Space</kbd><span>跳跃 / 跳伞</span></div>
          <div><kbd>左键</kbd><span>射击</span></div>
          <div><kbd>右键</kbd><span>瞄准 / 倍镜</span></div>
          <div><kbd>R</kbd><span>换弹</span></div>
          <div><kbd>1 / 2</kbd><span>切换武器</span></div>
          <div><kbd>F</kbd><span>拾取</span></div>
          <div><kbd>M</kbd><span>静音</span></div>
          <div><kbd>Esc</kbd><span>暂停</span></div>
        </div>
        <button id="ovBtn">点击开始</button>
        <button id="ovQuit">返回选图</button>
        <p class="hint">浏览器会锁住鼠标指针，按 Esc 释放</p>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
